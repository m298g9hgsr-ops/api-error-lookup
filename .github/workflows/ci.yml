# GitHub Actions CI/CD Pipeline for api-error-lookup
# Runs on every push and PR to main/develop branches

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: 'Skip E2E tests'
        required: false
        default: 'false'
        type: boolean

env:
  # Test environment variables
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-key-for-testing-only
  STRIPE_SECRET_KEY: sk_test_mock
  STRIPE_WEBHOOK_SECRET: whsec_mock
  OLLAMA_BASE_URL: http://localhost:11434
  DEFAULT_AI_MODEL: deepseek-coder:6.7b
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock-token
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  PLAYWRIGHT_BASE_URL: http://localhost:3000

jobs:
  # ============================================
  # STAGE 1: Lint & Type Check (Fast, no deps)
  # ============================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint
        working-directory: ./pstack-project/api-error-lookup

      - name: Run TypeScript type check
        run: npx tsc --noEmit
        working-directory: ./pstack-project/api-error-lookup

  # ============================================
  # STAGE 2: Unit Tests (Vitest) - No external deps
  # ============================================
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: ./pstack-project/api-error-lookup

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
        working-directory: ./pstack-project/api-error-lookup
        env:
          CI: true

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # Vitest will exit with non-zero if thresholds not met
        working-directory: ./pstack-project/api-error-lookup

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./pstack-project/api-error-lookup/coverage
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # STAGE 3: Integration Tests (requires PostgreSQL)
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: ./pstack-project/api-error-lookup

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: ./pstack-project/api-error-lookup

      - name: Run database migrations
        run: npm run db:migrate deploy
        working-directory: ./pstack-project/api-error-lookup

      - name: Run integration tests
        run: npm run test:integration
        working-directory: ./pstack-project/api-error-lookup
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          UPSTASH_REDIS_REST_URL: http://localhost:6379

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./pstack-project/api-error-lookup/coverage
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # STAGE 4: Build Application
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: ./pstack-project/api-error-lookup

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: ./pstack-project/api-error-lookup

      - name: Build application
        run: npm run build
        working-directory: ./pstack-project/api-error-lookup
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            ./pstack-project/api-error-lookup/.next
            ./pstack-project/api-error-lookup/public
          retention-days: 7

  # ============================================
  # STAGE 5: E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: ${{ github.event.inputs.skip_e2e != 'true' }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: ./pstack-project/api-error-lookup

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: ./pstack-project/api-error-lookup/.next

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: ./pstack-project/api-error-lookup

      - name: Run database migrations
        run: npm run db:migrate deploy
        working-directory: ./pstack-project/api-error-lookup

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./pstack-project/api-error-lookup

      - name: Start development server
        run: |
          npm run dev &
        working-directory: ./pstack-project/api-error-lookup
        env:
          PORT: 3000

      - name: Wait for dev server
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Dev server ready on http://localhost:3000"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server failed to start"
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./pstack-project/api-error-lookup
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./pstack-project/api-error-lookup/test-results/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: ./pstack-project/api-error-lookup/test-results/**/*.trace.zip
          retention-days: 7

  # ============================================
  # STAGE 6: Docker Build (Optional)
  # ============================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pstack-project/api-error-lookup
          push: false
          tags: api-error-lookup:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://test:test@host.docker.internal:5432/test \
            -e NEXTAUTH_SECRET=test-secret \
            api-error-lookup:${{ github.sha }}
          
          # Wait for container to start
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:3000/api/health || exit 1
          
          # Cleanup
          docker stop test-container

  # ============================================
  # STAGE 7: Security Scan (Optional)
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=high
        working-directory: ./pstack-project/api-error-lookup
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        if: ${{ secrets.SNYK_TOKEN != '' }}
        with:
          command: test
          args: --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: ./pstack-project/api-error-lookup

  # ============================================
  # STAGE 8: Summary & Gate
  # ============================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-and-typecheck, unit-tests, integration-tests, build, e2e-tests, docker-build, security-scan]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "=== Pipeline Summary ==="
          echo "Lint & Type Check: ${{ needs.lint-and-typecheck.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo ""
          
          REQUIRED_JOBS=("lint-and-typecheck" "unit-tests" "integration-tests" "build" "e2e-tests")
          FAILED=0
          
          for job in "${REQUIRED_JOBS[@]}"; do
            RESULT="${{ needs.$job.result }}"
            if [ "$RESULT" != "success" ]; then
              echo "❌ $job failed: $RESULT"
              FAILED=1
            else
              echo "✅ $job passed"
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "🚫 Pipeline FAILED - Required checks did not pass"
            exit 1
          else
            echo ""
            echo "🎉 All required checks PASSED!"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::notice::Pipeline failed - check the logs above for details"
        # Add Slack/Discord/Email notification here if needed