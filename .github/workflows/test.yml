# GitHub Actions Workflow for api-error-lookup
# Tests: Unit, Integration, E2E

name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
  NEXTAUTH_SECRET: test-secret-key-for-testing-only
  STRIPE_SECRET_KEY: sk_test_mock
  STRIPE_WEBHOOK_SECRET: whsec_mock
  OLLAMA_BASE_URL: http://localhost:11434
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: mock-token
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  PLAYWRIGHT_BASE_URL: http://localhost:3000

jobs:
  # Unit Tests - Fast, no external dependencies
  unit-tests:
    name: Unit Tests (80% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Run unit tests
        run: bun test tests/unit --coverage
        working-directory: .

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./pstack-project/api-error-lookup/coverage
          flags: unit
          fail_ci_if_error: false

  # Integration Tests - Requires PostgreSQL
  integration-tests:
    name: Integration Tests (70% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: .

      - name: Run database migrations
        run: bun run db:migrate deploy
        working-directory: .

      - name: Run integration tests
        run: bun test tests/integration --coverage
        working-directory: .

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./pstack-project/api-error-lookup/coverage
          flags: integration
          fail_ci_if_error: false

  # E2E Tests - Requires full stack
  e2e-tests:
    name: E2E Tests (100% core paths)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: bun run db:generate
        working-directory: .

      - name: Run database migrations
        run: bun run db:migrate deploy
        working-directory: .

      - name: Build application
        run: bun run build
        working-directory: .

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: .

      - name: Start dev server
        run: bun run dev &
        working-directory: .
        env:
          PORT: 3000

      - name: Wait for dev server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server failed to start"
          exit 1

      - name: Run E2E tests
        run: bun run test:e2e
        working-directory: .

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ./pstack-project/api-error-lookup/test-results/
          retention-days: 7

  # Lint & Type Check
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Run lint
        run: bun run lint
        working-directory: .

      - name: Run type check
        run: bunx tsc --noEmit
        working-directory: .

  # Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, lint-and-typecheck]
    if: always()
    steps:
      - name: Check all tests passed
        run: |
          if [[ "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" && \
                "${{ needs.e2e-tests.result }}" == "success" && \
                "${{ needs.lint-and-typecheck.result }}" == "success" ]]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Some tests failed:"
            echo "  Unit: ${{ needs.unit-tests.result }}"
            echo "  Integration: ${{ needs.integration-tests.result }}"
            echo "  E2E: ${{ needs.e2e-tests.result }}"
            echo "  Lint/Type: ${{ needs.lint-and-typecheck.result }}"
            exit 1
          fi